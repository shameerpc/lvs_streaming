services:
  api:
    build: .
    container_name: lvs-api
    ports:
      - "5000:5000"
    env_file:
      - .env
    depends_on:
      - mongo
      - redis
    restart: unless-stopped

  mongo:
    image: mongo:8
    container_name: lvs-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: lvs-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  mongo_data: